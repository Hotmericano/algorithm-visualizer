<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알고리즘 시각화</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>알고리즘 시각화</h1>
    <p class="subtitle">알고리즘을 한 단계씩 멈췄다 진행하며 살펴봅니다</p>
  </header>

  <main>
    <div class="controls">
      <button id="new-array-btn">새 배열</button>
    </div>

    <!-- 막대들이 들어갈 자리. main.js가 여기에 막대를 채워 넣습니다. -->
    <div id="bars" class="bars" aria-label="배열 막대 그래프"></div>
  </main>

  <!-- algorithms.js를 먼저 불러와야 main.js에서 정렬 함수를 쓸 수 있습니다. -->
  <script src="algorithms.js"></script>
  <script src="main.js"></script>
</body>
</html>
