<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알고리즘 시각화</title>
  <!-- 파일 주소 끝의 ?v=버전 : 버전이 바뀌면 브라우저가 예전 캐시 대신 새 파일을 받는다.
       CSS나 JS를 고친 PR에서는 이 숫자를 함께 올려 주세요. -->
  <link rel="stylesheet" href="style.css?v=0.3.0">
</head>
<body>
  <header>
    <h1>알고리즘 시각화</h1>
    <p class="subtitle">알고리즘을 한 단계씩 멈췄다 진행하며 살펴봅니다</p>
  </header>

  <main>
    <div class="controls">
      <!-- 정렬 알고리즘 고르기. 목록은 main.js가 SORT_ALGORITHMS를 보고 채웁니다. -->
      <select id="algorithm-select" aria-label="정렬 알고리즘"></select>
      <button id="new-array-btn">새 배열</button>
      <!-- 하나의 버튼이 상태에 따라 시작 / 일시정지 / 계속으로 바뀝니다. -->
      <button id="play-btn" class="primary">시작</button>
      <button id="step-btn" title="한 단계 앞으로">한 단계 ▶</button>

      <label class="speed">
        속도
        <input id="speed-slider" type="range" min="1" max="100" value="70">
      </label>

      <span id="status" class="status" aria-live="polite"></span>
    </div>

    <!-- 배열 직접 입력. form으로 감싸면 입력칸에서 Enter를 눌러도 적용된다. -->
    <form id="custom-form" class="custom">
      <label for="custom-input">배열 직접 입력</label>
      <input id="custom-input" type="text" inputmode="numeric" autocomplete="off"
             placeholder="예: 5, 3, 8, 1, 9, 2">
      <button type="submit">적용</button>
      <p id="custom-error" class="error" role="alert"></p>
    </form>

    <!-- 지금까지 재생한 비교·교환 횟수 -->
    <div class="counters" aria-live="off">
      <span>비교 <b id="compare-count">0</b></span>
      <span>교환 <b id="swap-count">0</b></span>
    </div>

    <!-- 막대들이 들어갈 자리. main.js가 여기에 막대를 채워 넣습니다. -->
    <div id="bars" class="bars" aria-label="배열 막대 그래프"></div>

    <!-- 막대 색이 무슨 뜻인지 알려 주는 범례 -->
    <ul class="legend">
      <li><span class="swatch"></span>기본</li>
      <li><span class="swatch compare"></span>비교 중</li>
      <li><span class="swatch swap"></span>교환</li>
      <li><span class="swatch sorted"></span>확정</li>
      <li><span class="swatch pivot"></span>피벗 (퀵 정렬)</li>
    </ul>

    <!-- 같은 배열로 끝까지 재생한 알고리즘들의 횟수 비교. 기록이 생기면 나타난다. -->
    <section id="results" class="results" hidden>
      <h2>같은 배열 비교</h2>
      <p class="hint">알고리즘을 바꾸면 같은 배열로 돌아갑니다. 끝까지 재생할 때마다 한 줄씩 쌓여요.</p>
      <table>
        <thead>
          <tr><th>알고리즘</th><th>비교</th><th>교환</th><th>전체 단계</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </section>
  </main>

  <!-- algorithms.js를 먼저 불러와야 main.js에서 정렬 함수를 쓸 수 있습니다. -->
  <script src="utils.js?v=0.3.0"></script>
  <script src="algorithms.js?v=0.3.0"></script>
  <script src="main.js?v=0.3.0"></script>
</body>
</html>
